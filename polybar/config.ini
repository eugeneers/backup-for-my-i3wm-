[colors]
background = #000
background-alt = #282828
foreground = #ffffff
alert = #cc241d
green = #98971a
yellow = #d79921
blue = #458588
purple = #b16286
aqua = #689d6a
red = #cc241d
cyan = #00ffff
[global/wm]
margin-top = 10
padding-left = 20
margin-bottom = 0

[bar/example]
width = 100%
height = 24pt

padding-left = 0
padding-right = 1
module-margin = 1
;radius =15

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 1pt
border-color =#ffffff

;separator = |
separator-foreground = ${colors.disabled}

font-0 = "Liga SFMono Nerd Font:size=14;2"
font-1 = "Liga SFMono Nerd Font:size=14;2"

modules-left = launcher xworkspaces xwindow
modules-center = date
modules-right = pulseaudio  memory cpu wlo1 eth  temperature notification battery tray


#cursor-click = pointer
#cursor-scroll = ns-resize

enable-ipc = true

[module/tray]
type = internal/tray
#tray-position = right
#tray-size = 18
#tray-padding = 2

[module/launcher]
type = custom/text
content = 
#content-background = ${color.black}
content-foreground = ${colors.cyan}
content-padding = 1
content-font = 4


[module/i3]
type = internal/i3

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.yellow}
label-active-padding = 1
label-occupied-foreground = ${colors.blue}

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

###############################################################################
# CPU
###############################################################################

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.aqua}
format-foreground = ${colors.foreground}
label = %percentage:2%%

###############################################################################
# RAM
###############################################################################

[module/memory]
type = internal/memory

interval = 2

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.purple}
format-foreground = ${colors.foreground}
label = %percentage_used:2%%

###############################################################################
# TEMPERATURE
###############################################################################

[module/temperature]
type = internal/temperature

thermal-zone= 7

interval = 2

format-prefix = " "
format-prefix-foreground = ${colors.blue}
format-foreground = ${colors.foreground}

label = %temperature-c%


###############################################################################
# NOTIFICATION	
###############################################################################

[module/notification]
type = custom/script
exec = ~/.config/polybar/notification.sh
interval = 1
click-left = dunstctl history
click-right = dunstctl close-all

###############################################################################
# BATTERY
###############################################################################

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC0

full-at = 100

poll-interval = 5

format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.#458588}

format-discharging-prefix = " "
format-discharging-prefix-foreground = ${colors.}

format-full-prefix = " "
format-full-prefix-foreground = ${colors.green}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

###############################################################################
# DATE / TIME
###############################################################################

[module/date]
type = internal/date

interval = 10

date =%A %eth %B %I:%M:%p
label = %date%  %time%
format-prefix-foreground = ${colors.red}
format-prefix = "󰃰 "
label-foreground = ${colors.foreground}


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix =" "
format-volume-foreground = ${colors.foreground}
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰖁
label-muted-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini



