corner-radius = 8;
rounded-corners-exclude = [
#	"window_type = 'normal'",
	"class_g ?= 'rofi'",
	"class_g ?= 'polybar'",
	"class_g ?= 'tint2'"
];

round-borders = 0;
round-borders-exclude = [
	"class_g = 'TelegramDesktop'"
];

round-borders-rule = [
	"2:class_g ?= 'URxvt'",
	"2:class_g ?= 'Alacritty'",
	"0:class_g ?= 'firefox'"
];

shadow = true;


shadow-radius = 14;


shadow-opacity = 0.30;

# The left offset for shadows, in pixels. (defaults to -15)
shadow-offset-x = -12;

# The top offset for shadows, in pixels. (defaults to -15)
shadow-offset-y = -12;

# shadow-exclude = []
shadow-exclude = [
	"class_g = 'Cairo-clock'",
	"class_g = 'CoverGloobus'",
	"class_g = 'Tilda'",
	"name ?= 'gnome-pie'",
#	"class_g = 'Dmenu'",
#	"class_g ?= 'rofi'",
	"class_g ?= 'polybar'",
    "class_g ?= 'Plank'",
    "name *= 'recordmydesktop'",
    "name = 'Notification'",
    "name = 'Docky'",
    "name = 'Kupfer'",
    "name = 'xfce4-notifyd'",
    "name = 'vlc'",
    "name *= 'Chromium'",
    "name *= 'Chrome'",
    "class_g = 'Conky'",
    "class_g = 'Kupfer'",
    "class_g = 'Synapse'",
    "class_g ?= 'Notify-osd'",
    "class_g ?= 'Cairo-dock'",
    "class_g ?= 'Xfce4-notifyd'",
    "class_g ?= 'Xfce4-power-manager'",
    "_GTK_FRAME_EXTENTS@:c",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

fading = true;

# Opacity change between steps while fading in. (0.01 - 1.0, defaults to 0.028)
fade-in-step = 0.03;

# Opacity change between steps while fading out. (0.01 - 1.0, defaults to 0.03)
fade-out-step = 0.03;

# The time between steps in fade step, in milliseconds. (> 0, defaults to 10)
fade-delta = 5;


fade-exclude = [
  "class_g = 'slop'"   # maim
]

# Do not fade on window open/close.
no-fading-openclose = false

# Do not fade destroyed ARGB windows with WM frame. Workaround of bugs in Openbox, Fluxbox, etc.
no-fading-destroyed-argb = true

#========================= Opacity =========================#


inactive-opacity = 0.8;

frame-opacity = 0.7;


inactive-opacity-override = false;

active-opacity = 1.0;

# Dim inactive windows. (0.0 - 1.0, defaults to 0.0)
#inactive-dim = 0.5

# focus-exclude = []
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",                    # lemonbar
  "class_g = 'slop'"                    # maim
];

# opacity-rule = []
opacity-rule = [
  "90:class_g    = 'Bar'",               #lemonbar
  "90:class_g    = 'slop'",              #maim
  "90:class_g    = 'XTerm'",
  "90:class_g    = 'URxvt'",
#  "90:class_g    = 'kitty'",
  "90:class_g    = 'Alacritty'",
  "70:class_g    = 'Polybar'",
  "90:class_g    = 'code-oss'",
  "90:class_g    = 'Meld'",
  "90:class_g    = 'TelegramDesktop'",
  "90:class_g    = 'Joplin'",
  "100:class_g    = 'firefox'",
  "80:class_g    = 'Thunderbird'",
  "100:class_g = 'vlc'"
];

#========================= Blurring =========================#

blur: {
  method = "dual_kawase";
  strength = 3;
#  deviation = 1.0;
#  kernel = "11x11gaussian";
  background = false;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
}

# Exclude conditions for background blur.
blur-background-exclude = [
#	"window_type = 'dock'",
	"window_type = 'desktop'",
	"class_g = 'Plank'",
	"class_g = 'slop'",
	"_GTK_FRAME_EXTENTS@:c"
];

# Specify the backend to use: `xrender`, `glx`, or `xr_glx_hybrid`.
# `xrender` is the default one.
#
#experimental-backends = true;
backend = "glx";

# Enable/disable VSync.
# vsync = false
vsync = true;

# Enable remote control via D-Bus. See the *D-BUS API* section below for more details.
# dbus = false

# Try to detect WM windows (a non-override-redirect window with no
# child that has 'WM_STATE') and mark them as active.
#
# mark-wmwin-focused = false
mark-wmwin-focused = true;

# Mark override-redirect windows that doesn't have a child window with 'WM_STATE' focused.
# mark-ovredir-focused = false
mark-ovredir-focused = true;

# Try to detect windows with rounded corners and don't consider them
# shaped windows. The accuracy is not very high, unfortunately.
#
# detect-rounded-corners = false
detect-rounded-corners = true;

# Detect '_NET_WM_OPACITY' on client windows, useful for window managers
# not passing '_NET_WM_OPACITY' of client windows to frame windows.
#
# detect-client-opacity = false
detect-client-opacity = true;

# Specify refresh rate of the screen. If not specified or 0, picom will
# try detecting this with X RandR extension.
#
# refresh-rate = 60
refresh-rate = 60;

detect-transient = true;

detect-client-leader = true;

# resize-damage = 1

# invert-color-include = []
glx-no-stencil = true;

## glx-no-rebind-pixmap = false

## no-use-damage = false
use-damage = true;

# xrender-sync-fence = false

# force-win-blend = false
# no-ewmh-fullscreen = false

# max-brightness = 1.0

# transparent-clipping = false

# log-level = "debug"
log-level = "info";


wintypes:
{
  tooltip = { fade=true; shadow=true; opacity=0.90; focus=true; full-shadow=false; };
  popup_menu = { opacity=0.80; }
  dropdown_menu = { opacity=0.80; }
  utility = { shadow=false; opacity=0.90; }
};

